<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재잘</title>
<meta name="description" content="하루 5분, 입으로 굳히는 영어 덩어리 표현. 폰 안에서 돌아가는 AI와 상황극까지.">
<meta name="theme-color" content="#111A16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F8F4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="재잘">
<meta property="og:description" content="하루 5분, 입으로 굳히는 영어 덩어리 표현. 폰 안에서 돌아가는 AI와 상황극까지.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpath d=%27M47 31c-7-13-1-20 4-21-1 7 1 14-1 21z%27 fill=%27%23FF7A6B%27/%3E%3Ccircle cx=%2750%27 cy=%2758%27 r=%2734%27 fill=%27%23FFD45C%27/%3E%3Ccircle cx=%2739%27 cy=%2752%27 r=%277%27 fill=%27%231F2A26%27/%3E%3Ccircle cx=%2761%27 cy=%2752%27 r=%277%27 fill=%27%231F2A26%27/%3E%3Cpath d=%27M42 62q8-7 16 0q-8 8-16 0z%27 fill=%27%23FF9A3C%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; a parrot-chick mascot reacts to everything; chunky press-down buttons; actions live in the thumb zone. */
:root{
  --bg:#F2F8F4; --surface:#FFFFFF; --sunk:#E5EFE9; --ink:#1F2A26; --muted:#62716B; --line:#D3E2D9;
  --mint:#2DBE8C; --mint-d:#1F9B71; --on-mint:#FFFFFF;
  --butter:#FFD45C; --butter-d:#E3B12F; --on-butter:#3A2A00;
  --coral:#FF7A6B; --coral-d:#DB5B4D; --sky:#79C2FF;
  --good:#17905F; --goodbg:#DDF5E8; --bad:#D9493D; --badbg:#FFE6E1;
  --teal:var(--mint); --on-teal:var(--on-mint); --amber:var(--butter); --on-amber:var(--on-butter);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:20px; --press:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A16; --surface:#1A2520; --sunk:#23302A; --ink:#EAF3EE; --muted:#9DAEA6; --line:#2E3D37;
  --mint:#4FD6A6; --mint-d:#2B9A73; --on-mint:#06221A; --butter:#FFD45C; --butter-d:#BF9426; --on-butter:#3A2A00;
  --coral:#FF8E81; --coral-d:#BF5A4E; --sky:#8ACBFF; --good:#6EE0A6; --goodbg:#163527; --bad:#FF8E81; --badbg:#3A201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A16; --surface:#1A2520; --sunk:#23302A; --ink:#EAF3EE; --muted:#9DAEA6; --line:#2E3D37;
  --mint:#4FD6A6; --mint-d:#2B9A73; --on-mint:#06221A; --butter:#FFD45C; --butter-d:#BF9426; --on-butter:#3A2A00;
  --coral:#FF8E81; --coral-d:#BF5A4E; --sky:#8ACBFF; --good:#6EE0A6; --goodbg:#163527; --bad:#FF8E81; --badbg:#3A201C; color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}
body.focus .wrap{padding-bottom:160px}
h1,h2,h3{text-wrap:balance;margin:0}
.title{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15}
.eyebrow{font-size:13px;font-weight:700;color:var(--mint-d)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}
.lead{font-size:15px;max-width:65ch}

/* chunky press-down surfaces */
.press{border:2px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:0 var(--press) 0 var(--line);transition:transform .08s,box-shadow .08s}
.press:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* mascot: a parrot chick (original). moods: idle · happy · oops · think · talk */
.mascot{display:block;overflow:visible}
.mascot .m-all{transform-origin:50% 90%;animation:bob 3.2s ease-in-out infinite}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot .beak-lo{transform-box:fill-box;transform-origin:50% 0;transition:transform .07s}
.mascot.open .beak-lo{transform:scaleY(1.9) translateY(1px)}
.mascot .wing{transform-box:fill-box;transform-origin:85% 15%}
.mascot .wing.r{transform-origin:15% 15%}
.mascot.happy .m-all{animation:hop .55s ease-out 2}
.mascot.happy .wing.l{animation:flapL .18s ease-in-out 6}
.mascot.happy .wing.r{animation:flapR .18s ease-in-out 6}
.mascot.oops .m-all{animation:tilt .9s ease-in-out 1 forwards}
.mascot.oops .tear{opacity:1}
.mascot .tear{opacity:0;transition:opacity .3s}
.mascot.think .pupil{animation:look 1.4s ease-in-out infinite}
.mascot.talk .m-all{animation:none}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-14px) scale(.95,1.05)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0)}}
@keyframes flapL{50%{transform:rotate(-28deg)}}
@keyframes flapR{50%{transform:rotate(28deg)}}
@keyframes tilt{30%{transform:rotate(-10deg)}100%{transform:rotate(-7deg)}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--mint-d);display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:22px;height:22px}
.greet{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:end}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-size:15px;line-height:1.45;margin-bottom:22px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block;margin-bottom:2px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .lbl b{font-family:var(--f-display);font-weight:400;font-size:24px}
.ring .lbl span{font-size:11px;color:var(--muted)}
.stamps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.stamp i{width:100%;max-width:32px;aspect-ratio:1;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.stamp i svg{width:18px;height:18px;opacity:.35}
.stamp.on i{background:var(--butter)}
.stamp.on i svg{opacity:1}
.stamp.now span{color:var(--ink);font-weight:700}
.streakline{font-size:14px;color:var(--muted);margin-bottom:10px}
.streakline b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:18px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:22px;
  padding:18px 20px;background:var(--butter);color:var(--on-butter);text-align:left;box-shadow:0 5px 0 var(--butter-d);transition:transform .08s,box-shadow .08s}
.cta:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--butter-d)}
.cta b{font-family:var(--f-display);font-weight:400;font-size:24px;display:block;line-height:1.15}
.cta span{font-size:13px;opacity:.85}
.cta .arrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);font-size:22px;flex:none}
.cta.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.cta.alt:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.cta.alt .arrow{background:var(--sunk)}
.cta.alt b{font-size:21px}
.cta:disabled{opacity:.5;cursor:default}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit{display:flex;align-items:center;gap:10px;padding:12px;min-width:0}
.unit .u-ring{width:40px;height:40px;flex:none}
.unit .u-t{font-weight:700;font-size:14px;line-height:1.3}
.unit .u-s{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--goodbg);color:var(--good)}
.chip.warn{background:var(--badbg);color:var(--bad)}
.sec-h{font-family:var(--f-display);font-weight:400;font-size:20px}

/* session */
.topbar{display:flex;align-items:center;gap:12px}
.x{border:0;background:transparent;font-size:26px;line-height:1;padding:8px;color:var(--muted);min-width:44px;min-height:44px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.combo{font-family:var(--f-display);font-size:16px;color:var(--coral);min-width:56px;text-align:right;display:flex;align-items:center;gap:2px;justify-content:flex-end}
.combo svg{width:18px;height:18px}
.task{background:transparent;padding:4px 2px;display:flex;flex-direction:column;gap:18px}
.task h2{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink)}
.asker{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.asker .bubble{margin-bottom:0}
.asker .bubble::before{bottom:auto;top:50%;margin-top:-7px}
.prompt-ko{font-size:22px;font-weight:700;line-height:1.35}
.prompt-en{font-size:21px;font-weight:700;line-height:1.35}
.ctx{font-size:13px;color:var(--muted)}
.speak{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;min-height:44px;box-shadow:0 3px 0 var(--line)}
.speak:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.speak[aria-pressed="true"]{border-color:var(--sky);color:var(--ink);background:color-mix(in srgb,var(--sky) 18%,var(--surface))}
.speak.jumbo{width:84px;height:84px;padding:0;border-radius:24px;justify-content:center;background:var(--sky);border-color:transparent;color:#06263f;box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.speak.jumbo svg{width:34px;height:34px}
.speak.jumbo span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:15px 16px;text-align:left;font-size:16px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:var(--goodbg);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:0 4px 0 var(--bad)}
.opt.right::after{content:" ✓";font-weight:700;color:var(--good)}
.opt.wrong::after{content:" ✕";font-weight:700;color:var(--bad)}
.answer{display:flex;flex-direction:column;align-items:center;gap:12px}
.answer textarea{width:100%}
textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;font-size:17px;min-height:56px}
.mic{flex:none;width:88px;height:88px;border-radius:50%;border:0;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;box-shadow:0 6px 0 var(--mint-d);position:relative;transition:transform .08s,box-shadow .08s}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-d)}
.mic svg{width:36px;height:36px}
.mic.live{background:var(--coral);box-shadow:0 6px 0 var(--coral-d)}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--coral);animation:ring 1.2s ease-out infinite}
.mic-hint{font-size:13px;color:var(--muted);text-align:center}
.composer .mic{width:56px;height:56px;box-shadow:0 4px 0 var(--mint-d)}
.composer .mic svg{width:24px;height:24px}
.composer .answer{flex-direction:row;align-items:stretch}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.primary{border:0;border-radius:16px;padding:16px;font-weight:700;background:var(--mint);color:var(--on-mint);width:100%;font-size:17px;box-shadow:0 5px 0 var(--mint-d);transition:transform .08s,box-shadow .08s;min-height:52px}
.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--mint-d)}
.primary:disabled{opacity:.45;cursor:default;background:var(--sunk);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font-size:14px;min-height:44px;box-shadow:0 3px 0 var(--line)}
.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px}
.tiles.slot{border-bottom:2px dashed var(--line);padding-bottom:12px;align-content:flex-start}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;font-size:17px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile[disabled]{opacity:.25;box-shadow:none}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
/* feedback sheet (bottom, thumb zone) */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:24px 24px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .25s ease-out;max-height:70vh;overflow:auto}
.fb .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--goodbg)}
.fb.bad{background:var(--badbg)}
.fb .head{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:400;font-size:24px}
.fb.good .head{color:var(--good)}
.fb.bad .head{color:var(--bad)}
.fb .primary{margin-top:6px}
.fb.bad .primary{background:var(--coral);box-shadow:0 5px 0 var(--coral-d);color:#fff}
.fb.bad .primary:active{box-shadow:0 1px 0 var(--coral-d)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.diff{font-size:17px;line-height:1.7}
.diff .miss{background:var(--butter);color:var(--on-butter);border-radius:6px;padding:0 4px}
.diff .extra{text-decoration:line-through;color:var(--bad)}
.xpfloat{font-family:var(--f-display);font-size:18px;color:var(--butter-d);margin-left:auto}

/* talk */
.scen{display:grid;gap:10px}
.scen button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.scen button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.scen button:disabled{opacity:.5}
.scen .lvl{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--butter);color:var(--on-butter)}
.scen .t{font-weight:700}
.scen .d{font-size:13px;color:var(--muted)}
.missions{display:flex;gap:6px;flex-wrap:wrap}
.missions .chip.ok{animation:pop .35s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.chat{display:flex;flex-direction:column;gap:10px}
.airow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:end;align-self:flex-start;max-width:92%}
.msg{max-width:88%;padding:12px 14px;border-radius:20px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.airow .msg{max-width:100%}
.msg.ai{align-self:flex-start;background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--mint);color:var(--on-mint);border-bottom-right-radius:6px}
.msg .ko{font-size:13px;color:var(--muted)}
.msg .tools{display:flex;gap:6px}
.msg .tools button{border:0;background:var(--sunk);border-radius:99px;font-size:12px;padding:6px 12px;min-height:32px}
.recast{align-self:flex-end;max-width:88%;font-size:14px;border-left:4px solid var(--butter);padding:8px 12px;background:var(--surface);border-radius:10px}
.recast b{display:block}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{border:2px dashed var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;text-align:left;min-height:40px}
.typing{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
body.focus .composer{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.hf{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* deck */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.filters button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;min-height:38px}
.filters button[aria-pressed="true"]{background:var(--mint);color:var(--on-mint);border-color:var(--mint)}
.cards{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-top:2px solid var(--line);align-items:center}
.card:first-child{border-top:0}
.card .en{font-weight:700;min-width:0}

<script>
"use strict";
/* DECK, SCENARIOS and WORDS live in content.js */


/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);

const SETTINGS_DEFAULT = {goal:50, sound:true, haptic:true, handsfree:false, autosubmit:true, showKo:false, rate:1, interests:[], studyTime:""};

}

/* ---------- mascot: an original parrot chick. moods: idle · happy · oops · think · talk ---------- */

/* ---------- grading: normalize → LCS diff → score ---------- */
const CONTR = {"i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would","it's":"it is","that's":"that is","what's":"what is","how's":"how is","you're":"you are","we're":"we are","they're":"they are","she's":"she is","he's":"he is","there's":"there is","where's":"where is","let's":"let us","can't":"can not","cannot":"can not","couldn't":"could not","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","won't":"will not","wouldn't":"would not","you've":"you have","we've":"we have","you'll":"you will","we'll":"we will"};
const NUM = {"1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
function toks(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'").replace(/[^a-z0-9' -]/g," ").replace(/-/g," ").split(/\s+/).filter(Boolean)
    .flatMap(w => (CONTR[w]||NUM[w]||w.replace(/^'+|'+$/g,"")).split(" ")).filter(Boolean);
}
function lcs(a,b){ const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keepA=new Set(),keepB=new Set(); let i=0,j=0; while(i<m&&j<n){ if(a[i]===b[j]){keepA.add(i);keepB.add(j);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return {len:dp[0][0],keepA,keepB}; }
function grade(answer, card){
  const A = toks(answer); let best = null;
  for (const target of [card.en, ...(card.alts||[])]) {
    const T = toks(target); const r = lcs(A,T); const score = (A.length+T.length) ? (2*r.len)/(A.length+T.length) : 0;
    if (!best || score > best.score) best = {score, target, A, T, r};
  }

}
function diffView(best){
  const mine = h("div",{class:"diff"}), right = h("div",{class:"diff"});
  best.A.forEach((w,i)=>{ mine.append(best.r.keepA.has(i) ? w+" " : h("span",{class:"extra"},w), best.r.keepA.has(i)?"":" "); });
  best.T.forEach((w,j)=>{ right.append(best.r.keepB.has(j) ? w+" " : h("span",{class:"miss"},w), best.r.keepB.has(j)?"":" "); });
  return {mine, right};
}

/* ---------- WORDS: the learner's missed words → word notebook (frequency first, word parts for long words) ---------- */
const FUNC_WORDS = new Set("i me my mine you your yours we our us he him his she her it its they them their a an the to of in on at for with and or but is am are was were be been being does did done have has had having will would can could should shall may might must this that these those there here what where when how who whom which why not no so up out about as by from if then than too very just let s ll d ve re t m into over under after before again all any some each every both more most less much many own same such only also yet still even now well get got gotten going gone came took made put say said see seen give know want need like one two three ten seven first oh hi hey yes please getting other off another myself yourself".split(" "));
const WORD_FORM = new Map(); Object.values(WORDS).forEach(w => [w.w, ...w.forms].forEach(f => WORD_FORM.set(f, w)));
const BAND_KO = {1:"자주 씀 · 상위 1,000", 2:"꽤 씀 · 상위 3,000", 3:"가끔 씀"};
function wordEntry(w){ return WORDS[w] || (S.wordCache||{})[w] || null; }
function lookupTok(t){ t = t.replace(/'s$/,""); if (WORD_IGNORE.includes(t) || FUNC_WORDS.has(t)) return null; return WORD_FORM.get(t) || (S.wordCache||{})[t] || null; }
/* words in the target the learner did not produce: content words only, most frequent first, then longest */
function missedWords(answer, target, max=2){
  const A = toks(answer), T = toks(target), r = lcs(A, T), out = [], unknown = [];
  T.forEach((t,j) => { if (r.keepB.has(j)) return; const e = lookupTok(t);
    if (e) { if (!out.includes(e)) out.push(e); }
    else { const u = t.replace(/'s$/,""); if (u.length >= 4 && !FUNC_WORDS.has(u) && !WORD_IGNORE.includes(u) && !unknown.includes(u)) unknown.push(u); } });
  return {known: out.sort((a,b)=>a.band-b.band || b.w.length-a.w.length).slice(0,max), unknown: unknown.slice(0,1)};
}
function hasWord(w){ return !!(S.words && S.words[w]); }
function addWord(w, src, auto){
  S.words = S.words || {}; if (!S.words[w]) setTimeout(()=>track("word_saved"), 0); const e = S.words[w] || {added:Date.now(), src:null, misses:0, auto:!!auto, stage:0};
  e.misses++; if (src && !e.src) e.src = src; S.words[w] = e;
  if (session && !session.done) { session.newWords = session.newWords || []; if (!session.newWords.includes(w)) session.newWords.push(w); }

function removeWord(w){ if (S.words) { delete S.words[w]; delete S.cards["w:"+w]; save(); } }
function srcFor(w){ const e = S.words && S.words[w]; if (e && e.src) return e.src;
  const entry = wordEntry(w); const forms = entry ? [entry.w, ...(entry.forms||[])] : [w];
  const c = DECK.find(c => toks(c.en).some(t => forms.includes(t.replace(/'s$/,"")))); return c ? {en:c.en, ko:c.ko} : null; }
/* ---------- word ladder: meet → recognise → cloze in its sentence → recall from Korean → cloze in a new sentence → make my own sentence ----------

const STAGE_KO = ["새 단어","뜻 알아보기","문장 속 빈칸","한→영 떠올리기","다른 문장 빈칸","내 문장 만들기"];
const WORD_NEW_PER_DAY = 5;
/* words saved before the ladder existed start from their memory strength */
const wordStage = w => { const e = S.words && S.words[w]; if (!e) return 0; if (typeof e.stage === "number") return e.stage; return S.cards["w:"+w] ? Math.min(3, 1 + Math.max(0, mastery("w:"+w)-1)) : 0; };
function setStage(w, ok){ const e = S.words && S.words[w]; if (!e) return; const st = wordStage(w);
  e.stage = ok ? Math.min(5, Math.max(1, st) + 1) : Math.max(1, st - 1); e.best = Math.max(e.best||0, e.stage); }

function otherContext(w, notEn){ const f = formsOf(w);
  const list = DECK.filter(c => c.en !== notEn && toks(c.en).some(t => f.has(t.replace(/'s$/,""))));

/* which exercise fits a word now; rung 5 needs the on-device AI, otherwise it alternates recall and new-context cloze */
function wordStepFor(w){

  if (lvl === 2) return src ? {type:"wordcloze", id:"w:"+w} : {type:"wordrecall", id:"w:"+w};
  if (lvl === 3) return {type:"wordrecall", id:"w:"+w};

/* ---------- CURRICULUM: units = (CEFR level × situation), ordered A1→B2, interests first within a level ---------- */
const LEVELS = ["A1","A2","B1","B2"];
const LEVEL_KO = {A1:"기초", A2:"초급", B1:"중급", B2:"중상급"};
const LEVEL_CAN = {A1:"인사하고 간단히 주문하기", A2:"익숙한 상황에서 짧게 대화하기", B1:"여행·일상 대화를 대부분 해내기", B2:"회의·의견 조율까지 자연스럽게"};
const myLevel = () => LEVELS.includes(S.level) ? S.level : "A1";
function buildCurriculum(){
  const like = S.settings.interests || [];
  const tags = [...new Set(DECK.map(c=>c.tag))].sort((a,b)=> (like.includes(b)-like.includes(a)));
  const units = [];
  LEVELS.forEach(L => tags.forEach(t => { const cards = DECK.filter(c=>c.lvl===L && c.tag===t).map(c=>c.id);
    if (!cards.length) return;
    const scen = SCENARIOS.find(x=>x.tag===t && x.lvl===L) || null;
    const done = cards.filter(id=>mastery(id)>=2).length;
    units.push({id:L+"·"+t, lvl:L, tag:t, cards, scen, done, total:cards.length, complete: done/cards.length >= .8}); }));
  const startIdx = Math.max(0, units.findIndex(u=>u.lvl===myLevel()));
  let cur = units.findIndex((u,i)=>i>=startIdx && !u.complete); if (cur < 0) cur = units.length-1;
  units.forEach((u,i)=>{ u.status = u.complete ? "done" : i===cur ? "now" : i<startIdx ? "skipped" : i<cur ? "open" : "next"; });
  return {units, cur, startIdx};
}
function currentUnit(){ const c = buildCurriculum(); return c.units[c.cur]; }

/* ---------- LEARN: build a 5-minute interleaved session ---------- */
function buildSession(){
  const k = dayKey(); if (S.newDay !== k) { S.newDay = k; S.newCount = 0; }
  const due = dueList().slice(0, 8);
  const newBudget = Math.max(0, Math.min(NEW_PER_DAY - S.newCount, 10 - due.length));
  /* new chunks come from the chosen/current unit, then the following units, then the learner's own saved chunks */
  const cur = buildCurriculum(); let from = cur.cur;

/* ---------- PLACEMENT: self-assessment (DIALANG-style) → 10 adaptive items (CAT-style staircase) → 30s speaking sample (CAF) ---------- */
const PLACE_ITEMS = 10;
function viewPlacement(app){
  setFocusMode(true);
  const P = {theta:0, i:0, used:new Set(), results:[], wpm:null, words:0, stage:"self"};
  const total = 1 + PLACE_ITEMS + (caps.dict ? 1 : 0);

    h("button",{class:"x","aria-label":"진단 그만하기",onclick:()=>{ location.hash = "#home"; }},"×"),

    h("button",{class:"ghost",type:"button",onclick:()=>{ location.hash = "#home"; }},"나중에"));
  const clear = (n) => { app.replaceChildren(bar(n)); stopDict(); const box = h("section",{class:"task"}); app.append(box); return box; };

  function self(){
    const box = clear(0);
    asker(box, "영어로 어느 정도 말할 수 있어?");
    box.append(h("p",{class:"ctx"},"가장 가까운 걸 골라 줘. 그다음 짧은 문제로 확인할게."));
    const pick = h("div",{class:"pick"});
    LEVELS.forEach((L,i) => pick.append(h("button",{class:"press",type:"button",onclick:()=>{ P.theta = i; sfx("tap"); item(); }}, h("span",{}, h("b",{}, LEVEL_CAN[L])), h("small",{}, L))));
    pick.append(h("button",{class:"press",type:"button",onclick:()=>{ P.theta = 0; sfx("tap"); item(); }}, h("span",{}, h("b",{},"잘 모르겠어")), h("small",{},"쉬운 것부터")));

    const want = Math.max(0, Math.min(3, Math.round(P.theta)));
    for (const d of [0,1,-1,2,-2,3,-3]) { const L = LEVELS[want+d]; if (!L) continue;
      const pool = DECK.filter(c=>c.lvl===L && !P.used.has(c.id)); if (pool.length) return pool[Math.random()*pool.length|0]; }
    return null;
  }
  function answer(card, type, ok){
    P.results.push({id:card.id, lvl:card.lvl, type, ok});
    const step = P.i < 4 ? .5 : .25;

      const play = h("button",{class:"speak jumbo",type:"button","aria-pressed":"false","aria-label":"다시 듣기",html:ICON.spk+"<span>다시 듣기</span>"}); play.onclick = () => say(card.en, 1, play, m);

    const skip = h("button",{class:"ghost",type:"button",onclick:()=>result()},"건너뛰기");

    app.append(h("section",{class:"celebrate"}, m, h("p",{class:"eyebrow"},"실력 진단 결과"), h("h1",{class:"title"}, "추천 시작 레벨"), h("span",{class:"lvl-badge",style:"font-size:28px"}, `${rec} ${LEVEL_KO[rec]}`), h("p",{class:"muted"}, "이 레벨의 목표: "+LEVEL_CAN[rec]+". 지금 실력에 딱 맞는 출발점이야.")));
    const hb = (lab, pct, val) => h("div",{class:"hbar"}, h("span",{}, lab), h("span",{class:"t"}, h("i",{style:`width:${Math.round(pct*100)}%`})), h("span",{class:"v"}, val));

      h("p",{class:"ctx"}, "듣기·말하기는 진단 문제 정답률, 유창성은 자기소개의 분당 단어 수예요.")));

   ["CAF 기반 분석","1:1 수업 녹음을 복잡성·정확성·유창성으로 나눠 보여 주는 분석 방식을 대화 피드백 숫자에 가볍게 옮겼습니다."],
   ["대화에서 나온 표현을 복습으로","AI 튜터 대화에서 나온 표현을 간격 반복 복습으로 넘기는 구조를 그대로 따릅니다."],
   ["짧은 세션과 연속 기록","5분 세션, 일일 목표, 연속 기록처럼 매일 돌아오게 만드는 장치는 대부분의 인기 앱이 공통으로 씁니다."]
  ].forEach(([t,b]) => RE.append(h("article",{}, h("h3",{}, t), h("p",{class:"use"}, b))));
  app.append(RE);
}

/* on open: spend streak freezes for missed days and greet learners coming back after a break */
if (S.onboarded) { applyFreezes(); S.bestStreak = Math.max(S.bestStreak||0, streakNow()); checkBadges(); const t = dayKey();
  if (S.lastSeen && daysBetween(S.lastSeen, t) >= 3 && S.welcomeDay !== t) { S.welcomeDay = t; S.pending = [{kind:"welcome", days:daysBetween(S.lastSeen, t)}, ...(S.pending||[])]; }
  S.lastSeen = t; save(); }
route();
