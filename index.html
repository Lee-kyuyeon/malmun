<style>
/* Layout: one phone-width column, a VU-meter strip as the signature, bottom tab bar. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#E2E8E4; --ink:#122019; --muted:#56665E; --line:#CBD6CF;
  --amber:#E39B0B; --on-amber:#1B1406; --teal:#16705E; --on-teal:#FFFFFF;
  --good:#1D7F47; --goodbg:#DCF0E3; --bad:#B83A26; --badbg:#F7E0DA;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#15201B; --sunk:#1C2A24; --ink:#E6EEEA; --muted:#93A59C; --line:#2A3A33;
  --amber:#F2B13C; --on-amber:#1B1406; --teal:#4FC3A6; --on-teal:#06231C;
  --good:#5BD08B; --goodbg:#163325; --bad:#FF8A73; --badbg:#3A1E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#15201B; --sunk:#1C2A24; --ink:#E6EEEA; --muted:#93A59C; --line:#2A3A33;
  --amber:#F2B13C; --on-amber:#1B1406; --teal:#4FC3A6; --on-teal:#06231C;
  --good:#5BD08B; --goodbg:#163325; --bad:#FF8A73; --badbg:#3A1E19; color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.brand{font-family:var(--f-display);font-size:64px;line-height:.9;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-top:10px;letter-spacing:0}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .lbl b{font-family:var(--f-mono);font-size:20px}
.ring .lbl span{font-size:11px;color:var(--muted)}

/* VU strip */
.vu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.vu-bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:64px;margin-top:10px}
.vu-bars i{display:block;border-radius:3px 3px 1px 1px;background:var(--sunk);min-height:4px}
.vu-bars i.on{background:var(--teal)}
.vu-bars i.today{background:var(--amber)}
.vu-axis{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:4px;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:var(--r);
  padding:18px 20px;background:var(--amber);color:var(--on-amber);text-align:left}
.cta b{font-family:var(--f-display);font-size:24px;font-weight:400;display:block;line-height:1.1}
.cta span{font-size:13px;opacity:.85}
.cta .arrow{font-family:var(--f-mono);font-size:28px}
.cta.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.cta.alt b{font-size:20px}
.cta:disabled{opacity:.5;cursor:default}

.note{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--goodbg);color:var(--good)}

/* session */
.topbar{display:flex;align-items:center;gap:12px}
.x{border:0;background:transparent;font-size:22px;line-height:1;padding:6px;color:var(--muted)}
.prog{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.combo{font-family:var(--f-mono);font-size:13px;color:var(--amber);min-width:44px;text-align:right}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.task h2{font-size:15px;font-weight:500;color:var(--muted)}
.prompt-ko{font-size:24px;font-weight:700;line-height:1.35}
.prompt-en{font-size:22px;font-weight:600;line-height:1.35}
.ctx{font-size:13px;color:var(--muted)}
.speak{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-size:14px}
.speak[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;text-align:left;font-size:16px}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.answer{display:flex;gap:8px;align-items:stretch}
textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;min-height:54px}
.mic{flex:none;width:54px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}.prog i{transition:none}}
.primary{border:0;border-radius:12px;padding:15px;font-weight:700;background:var(--teal);color:var(--on-teal);width:100%;font-size:16px}
.primary:disabled{opacity:.45;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:12px 14px;font-size:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.tiles.slot{border-bottom:2px dashed var(--line);padding-bottom:10px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:16px}
.tile[disabled]{opacity:.25}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--goodbg)}
.fb.bad{background:var(--badbg)}
.fb .head{font-weight:700}
.fb.good .head{color:var(--good)}
.fb.bad .head{color:var(--bad)}
.diff{font-size:17px;line-height:1.7}
.diff .miss{background:var(--amber);color:var(--on-amber);border-radius:4px;padding:0 3px}
.diff .extra{text-decoration:line-through;color:var(--bad)}
.xpfloat{font-family:var(--f-mono);font-weight:600;color:var(--amber)}

/* talk */
.scen{display:grid;gap:10px}
.scen button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px}
.scen .lvl{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk)}
.scen .t{font-weight:700}
.scen .d{font-size:13px;color:var(--muted)}
.missions{display:flex;gap:6px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--teal);color:var(--on-teal);border-bottom-right-radius:4px}
.msg .ko{font-size:13px;color:var(--muted)}
.msg .tools{display:flex;gap:6px}
.msg .tools button{border:0;background:var(--sunk);border-radius:99px;font-size:12px;padding:4px 10px}
.recast{align-self:flex-end;max-width:88%;font-size:14px;border-left:3px solid var(--amber);padding:6px 10px;background:var(--surface);border-radius:6px}
.recast b{display:block}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:14px;text-align:left}
.typing{color:var(--muted);font-size:14px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}

/* deck */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.card:first-child{border-top:0}
.card .en{font-weight:600;min-width:0}
.card .ko{font-size:13px;color:var(--muted);grid-column:1}
.card .m{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:end;gap:4px}
.meter{display:flex;gap:2px}
.meter i{width:6px;height:14px;border-radius:2px;background:var(--sunk)}
.meter i.on{background:var(--teal)}
.card .m span{font-size:11px;color:var(--muted)}

/* science */
.prin{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prin article{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.prin article:first-child{border-top:0}
.prin h3{font-size:17px}
.prin .src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prin .use{font-size:14px}
.prin .use b{color:var(--teal)}
.lead{font-size:15px;max-width:65ch}

/* recap */
.big{font-family:var(--f-display);font-size:40px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{font-family:var(--f-mono);font-size:24px;display:block}
.kpi span{font-size:12px;color:var(--muted)}

/* tab bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{color:var(--amber)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:380px){.brand{font-size:52px}.ring{width:84px;height:84px}}
/* on-device model setup */
.models{display:grid;gap:8px}
.model{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left}
.model[aria-checked="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.model .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.model[aria-checked="true"] .dot{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,transparent 50%)}
.model .nm{font-weight:700}
.model .sub{font-size:12px;color:var(--muted)}
.model .sz{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dl{display:flex;flex-direction:column;gap:6px}
.dl .bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.dl .bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
.dl .txt{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
</style>
</head>

const DECK = [

const h = (tag, attrs={}, ...kids) => { const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if (v==null||v===false) continue;
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else if (k==="html") e.innerHTML=v; else e.setAttribute(k, v===true?"":v); }
  for (const c of kids.flat()) { if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e; };

function canSpeak(){ return "speechSynthesis" in window; }
async function say(text, rate=1, btn){
  if (!canSpeak()) return;

  await new Promise(res => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang="en-US"; if (enVoice) u.voice=enVoice; u.rate = rate; u.onend=res; u.onerror=res; speechSynthesis.speak(u); setTimeout(res, 9000); } catch(_) { res(); } });

/* speech in: the browser's speech recognition (Chrome on Android, Safari on iOS 14.5+) */
let rec = null;
function refreshMics(){ document.querySelectorAll(".mic").forEach(m=>m.hidden=!caps.dict); }
function micFor(field){
  const b = h("button",{class:"mic",type:"button","aria-label":"말해서 입력",html:ICON.mic});
  b.hidden = !caps.dict;
  b.onclick = () => {
    if (rec) { try { rec.stop(); } catch(e){} return; }
    try { speechSynthesis.cancel(); } catch(e){}
    const r = new SR(); rec = r;
    r.lang = "en-US"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    const base = field.value.trim() ? field.value.trim()+" " : "";
    r.onresult = e => { let fin = "", inter = "";
      for (let i=0;i<e.results.length;i++){ const x = e.results[i]; if (x.isFinal) fin += x[0].transcript; else inter += x[0].transcript; }
      field.value = (base + fin).trim(); field.placeholder = inter || "듣고 있어요…"; field.dispatchEvent(new Event("input")); };
    r.onerror = e => {
      if (e.error==="not-allowed"||e.error==="service-not-allowed") { caps.dict = false; refreshMics(); toast("마이크 권한이 없어 타이핑으로 진행해요."); }
      else if (e.error==="no-speech") toast("소리가 들리지 않았어요. 다시 눌러 말해 주세요.");
      else if (e.error==="network") toast("음성인식에 인터넷 연결이 필요해요.");
    };
    r.onend = () => { b.classList.remove("live"); field.placeholder = field.dataset.ph || ""; if (rec === r) rec = null; };
    try { r.start(); b.classList.add("live"); field.placeholder = "듣고 있어요…"; } catch(e) { rec = null; }
  };
  return b;
}
async function stopDict(){ const r = rec; if (!r) return; await new Promise(res => { r.addEventListener("end", res, {once:true}); try { r.stop(); } catch(e) { res(); } setTimeout(res, 1500); }); }

/* ---------- on-device LLM (WebLLM + WebGPU). Weights download once, then stay in the browser cache. ---------- */
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.86/+esm";
const MODELS = [
  {key:"std", nm:"표준 · Qwen2.5 1.5B", sub:"대부분의 최신 폰. 한국어 번역도 무난해요.", sz:"약 1GB", f16:"Qwen2.5-1.5B-Instruct-q4f16_1-MLC", f32:"Qwen2.5-1.5B-Instruct-q4f32_1-MLC"},
  {key:"lite", nm:"가벼움 · Qwen2.5 0.5B", sub:"메모리가 적은 폰. 대화가 단순해요.", sz:"약 400MB", f16:"Qwen2.5-0.5B-Instruct-q4f16_1-MLC", f32:"Qwen2.5-0.5B-Instruct-q4f32_1-MLC"},
  {key:"pro", nm:"고품질 · Qwen2.5 3B", sub:"노트북이나 고사양 폰. 교정이 더 정확해요.", sz:"약 2GB", f16:"Qwen2.5-3B-Instruct-q4f16_1-MLC", f32:"Qwen2.5-3B-Instruct-q4f32_1-MLC"}
];
const llm = { lib:null, engine:null, modelId:null, key:null, gpu:undefined, loading:false };
let modelPick = (()=>{ try { return localStorage.getItem("malmun.model") || "std"; } catch(e){ return "std"; } })();
async function gpuInfo(){
  if (llm.gpu !== undefined) return llm.gpu;
  try { if (!navigator.gpu) return (llm.gpu = null); const a = await navigator.gpu.requestAdapter(); llm.gpu = a ? {f16: a.features.has("shader-f16")} : null; }
  catch(e) { llm.gpu = null; }
  return llm.gpu;
}
function modelIdFor(key, gpu){ const m = MODELS.find(x=>x.key===key) || MODELS[0]; return gpu && gpu.f16 ? m.f16 : m.f32; }
async function libLoad(){ if (!llm.lib) llm.lib = await import(WEBLLM_URL); return llm.lib; }
async function isCached(key){ try { const gpu = await gpuInfo(); if (!gpu) return false; const lib = await libLoad(); return await lib.hasModelInCache(modelIdFor(key, gpu)); } catch(e) { return false; } }
async function loadLLM(key, onProgress){
  const gpu = await gpuInfo(); if (!gpu) throw new Error("nogpu");
  const id = modelIdFor(key, gpu);
  if (llm.engine && llm.modelId === id) return;
  llm.loading = true;
  try {
    const lib = await libLoad();
    if (llm.engine) { try { await llm.engine.unload(); } catch(e){} llm.engine = null; }
    llm.engine = await lib.CreateMLCEngine(id, { initProgressCallback: onProgress });
    llm.modelId = id; llm.key = key;
    try { localStorage.setItem("malmun.model", key); } catch(e){}
  } finally { llm.loading = false; }
}
function parseLoose(t){
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a > -1 && b > a) { try { return JSON.parse(t.slice(a, b+1)); } catch(e){} }
  return null;
}
async function llmJSON(system, user, maxTokens=280){
  const r = await llm.engine.chat.completions.create({
    messages:[{role:"system",content:system},{role:"user",content:user}],
    temperature:0.6, max_tokens:maxTokens, response_format:{type:"json_object"}
  });
  const txt = (r.choices && r.choices[0] && r.choices[0].message && r.choices[0].message.content) || "";
  return parseLoose(txt) || {reply: txt.trim()};
}

/* ---------- grading: normalize → LCS diff → score ---------- */
const CONTR = {"i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would","it's":"it is","that's":"that is","what's":"what is","how's":"how is","you're":"you are","we're":"we are","they're":"they are","she's":"she is","he's":"he is","there's":"there is","where's":"where is","let's":"let us","can't":"can not","cannot":"can not","couldn't":"could not","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","won't":"will not","wouldn't":"would not","you've":"you have","we've":"we have","you'll":"you will","we'll":"we will"};
const NUM = {"1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
function toks(s){
  return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' -]/g," ").replace(/-/g," ").split(/\s+/).filter(Boolean)
    .flatMap(w => (CONTR[w]||NUM[w]||w.replace(/^'+|'+$/g,"")).split(" ")).filter(Boolean);
}
function lcs(a,b){ const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keepA=new Set(),keepB=new Set(); let i=0,j=0; while(i<m&&j<n){ if(a[i]===b[j]){keepA.add(i);keepB.add(j);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return {len:dp[0][0],keepA,keepB}; }
function grade(answer, card){
  const A = toks(answer); let best = null;
  for (const target of [card.en, ...(card.alts||[])]) {
    const T = toks(target); const r = lcs(A,T); const score = (A.length+T.length) ? (2*r.len)/(A.length+T.length) : 0;
    if (!best || score > best.score) best = {score, target, A, T, r};
  }
  return best;
}
function diffView(best){
  const mine = h("div",{class:"diff"}), right = h("div",{class:"diff"});
  best.A.forEach((w,i)=>{ mine.append(best.r.keepA.has(i) ? w+" " : h("span",{class:"extra"},w), best.r.keepA.has(i)?"":" "); });
  best.T.forEach((w,j)=>{ right.append(best.r.keepB.has(j) ? w+" " : h("span",{class:"miss"},w), best.r.keepB.has(j)?"":" "); });
  return {mine, right};
}

/* ---------- spacing: FSRS-style memory model (R = 0.9 when t = S) ---------- */
const DAY = 86400000;
function schedule(id, g){ /* g: 1 again, 2 hard, 3 good, 4 easy */
  const now = Date.now(); const c = S.cards[id] || {s:0,d:5,due:now,reps:0,lapses:0,last:0};
  if (!c.reps) { c.s = [0.02,0.6,1.5,4][g-1]; c.d = [7,6,5,3.5][g-1]; }
  else {
    const t = Math.max(0,(now - c.last)/DAY); const R = Math.pow(1 + t/(9*c.s), -1);
    if (g === 1) { c.lapses++; c.s = Math.max(0.02, c.s*0.3); c.d = Math.min(10, c.d+1.5); }
    else { const f = g===2?0.55:g===4?1.5:1; c.s = c.s * (1 + Math.exp(1.1)*((11-c.d)/10)*Math.pow(c.s,-0.18)*(Math.exp((1-R)*1.2)-0.9)*f); c.d = Math.max(1, Math.min(10, c.d + (3-g)*0.6)); }
  }
  c.reps++; c.last = now; c.due = now + Math.max(c.s, 0.007)*DAY; S.cards[id] = c; return c;
}
function gradeFrom(score, ms){ if (score < 0.6) return 1; if (score < 0.92 || ms > 15000) return 2; if (score >= 0.99 && ms < 5000) return 4; return 3; }
function mastery(id){ const c=S.cards[id]; if(!c) return 0; if(c.s>=21) return 4; if(c.s>=7) return 3; if(c.s>=1.5) return 2; return 1; }
const MASTERY_LABEL = ["처음","익히는 중","눈에 익음","입에 붙음","장기 기억"];

/* ---------- XP, streak ---------- */
function addXP(n){
  const k = dayKey(); S.xp += n; S.hist[k] = (S.hist[k]||0) + n;
  if (S.lastDay !== k) { const y = dayKey(new Date(Date.now()-DAY)); S.streak = (S.lastDay===y) ? S.streak+1 : 1; S.lastDay = k; }
  save();
}
function streakNow(){ const k=dayKey(), y=dayKey(new Date(Date.now()-DAY)); return (S.lastDay===k||S.lastDay===y) ? S.streak : 0; }
function dueList(){ const now=Date.now(); return Object.entries(S.cards).filter(([id,c])=>c.due<=now && cardById(id)).sort((a,b)=>a[1].due-b[1].due).map(([id])=>id); }

/* ---------- LEARN: build a 5-minute interleaved session ---------- */
function buildSession(){
  const k = dayKey(); if (S.newDay !== k) { S.newDay = k; S.newCount = 0; }
  const due = dueList().slice(0, 8);
  const newBudget = Math.max(0, Math.min(NEW_PER_DAY - S.newCount, 10 - due.length));
  const fresh = allCards().filter(c=>!S.cards[c.id]).slice(0, Math.max(newBudget, due.length? 0 : 3)).map(c=>c.id);
  let extra = [];
  if (due.length + fresh.length < 5) extra = Object.entries(S.cards).filter(([id])=>!due.includes(id)&&cardById(id)).sort((a,b)=>a[1].due-b[1].due).slice(0, 5-due.length-fresh.length).map(([id])=>id);
  const steps = [];
  fresh.forEach(id => steps.push({type:"listen", id}));
  const prod = shuffle([...fresh.map(id=>({type:"tiles", id})), ...[...due, ...extra].map((id,i)=>({type: i%3===2 ? "shadow":"recall", id}))]);
  const firstHalf = steps.splice(0, Math.ceil(steps.length/2));
  const out = [...firstHalf]; let li = 0;
  prod.forEach((p,i)=>{ out.push(p); if (i%2===1 && li < steps.length) out.push(steps[li++]); });
  while (li < steps.length) out.push(steps[li++]);
  const seenListen = new Set(); const fixed = [];
  for (const s of out) { if (s.type==="tiles" && !seenListen.has(s.id)) { const j = out.findIndex(x=>x.type==="listen"&&x.id===s.id); if (j>-1 && !fixed.includes(out[j])) fixed.push(out[j]); seenListen.add(s.id); }
    if (s.type==="listen") { if (fixed.includes(s)) continue; seenListen.add(s.id); } fixed.push(s); }
  return {steps: fixed, i:0, combo:0, xp:0, right:0, total:0, misses:{}, retried:new Set(), started:Date.now(), done:false};
}
function viewLearnStart(app){
  session = buildSession();
  if (!session.steps.length) { app.append(h("h2",{},"오늘 분량을 모두 마쳤어요"), h("p",{class:"muted"},"내일 다시 오면 잊어버리기 직전의 표현부터 꺼내 드려요.")); return; }
  renderStep();
}
function renderStep(){
  const app = $("#app"); app.replaceChildren(); stopDict();
  const s = session; if (s.i >= s.steps.length) return renderRecap();
  const step = s.steps[s.i], card = cardById(step.id);
  if (!card) { s.i++; return renderStep(); }
  app.append(h("div",{class:"topbar"}, h("button",{class:"x","aria-label":"그만하기",onclick:()=>{ session=null; location.hash="#home"; route(); }},"×"),
    h("div",{class:"prog",role:"progressbar","aria-valuemin":"0","aria-valuemax":String(s.steps.length),"aria-valuenow":String(s.i)}, h("i",{style:`width:${s.i/s.steps.length*100}%`})),
    h("span",{class:"combo"}, s.combo>=2 ? "x"+Math.min(2,1+s.combo*0.2).toFixed(1) : "")));
  const box = h("section",{class:"task"}); app.append(box);
  ({listen:taskListen, tiles:taskTiles, recall:taskRecall, shadow:taskShadow})[step.type](box, card, step);
}
function finish(box, card, step, score, ms, extra){
  const s = session, prod = step.type !== "listen";
  if (prod) { s.total++; const g = gradeFrom(score, ms); schedule(card.id, g);
    if (!S.cards[card.id] || S.cards[card.id].reps===1) { S.newCount++; }
    if (score >= 0.6) { s.right++; s.combo++; } else { s.combo = 0; s.misses[card.id]=(s.misses[card.id]||0)+1;
      if (!s.retried.has(card.id)) { s.retried.add(card.id); s.steps.splice(Math.min(s.i+3, s.steps.length), 0, {type:"recall", id:card.id}); } } }
  const mult = Math.min(2, 1 + Math.max(0,s.combo-1)*0.2);
  const gain = Math.round((prod ? 10*score : 4) * mult) + (prod && score>=0.99 && ms<5000 ? 3 : 0);
  if (gain) { s.xp += gain; addXP(gain); } else save();
  const good = score >= 0.92, ok = score >= 0.6;
  const fb = h("div",{class:"fb "+(ok?"good":"bad")}, h("div",{class:"head"}, good ? "정확해요" : ok ? "거의 맞았어요" : "다시 볼게요", gain ? h("span",{class:"xpfloat"}," +"+gain+" XP") : ""));
  if (extra) fb.append(extra);
  if (card.note) fb.append(h("div",{class:"ctx"}, card.note));
  const next = h("button",{class:"primary",onclick:()=>{ s.i++; renderStep(); }}, s.i+1 >= s.steps.length ? "결과 보기" : "다음");
  box.append(fb, next); next.focus();
}

  const opts = shuffle([card, ...pool]); const t0 = Date.now();

function taskTiles(box, card, step){
  header(box, "단어를 순서대로 놓기");
  box.append(h("p",{class:"prompt-ko"}, card.ko));
  const words = card.en.split(/\s+/); const picked = []; const t0 = Date.now();
  const slot = h("div",{class:"tiles slot","aria-label":"내가 만든 문장"}), bank = h("div",{class:"tiles"});
  const check = h("button",{class:"primary",disabled:true}, "확인");
  const draw = () => { slot.replaceChildren(...picked.map((p,k)=>h("button",{class:"tile",onclick:()=>{ picked.splice(k,1); bankBtns[p].disabled=false; draw(); }}, words[p])));
    check.disabled = picked.length !== words.length; };
  const bankBtns = shuffle(words.map((w,i)=>i)).reduce((acc,i)=>{ const b=h("button",{class:"tile",onclick:()=>{ picked.push(i); b.disabled=true; draw(); }}, words[i]); acc[i]=b; bank.append(b); return acc; }, {});
  check.onclick = () => { check.remove(); bank.querySelectorAll("button").forEach(b=>b.disabled=true); slot.querySelectorAll("button").forEach(b=>b.disabled=true);
    const ans = picked.map(i=>words[i]).join(" "); const g = grade(ans, card); const ex = h("div",{class:"row"}, speakBtn(card.en,"정답 듣기"));
    if (g.score < 0.99) { const d = diffView({...g, target:card.en, T:toks(card.en), r:lcs(g.A,toks(card.en))}); ex.prepend(d.right); }
    finish(box, card, step, g.score, Date.now()-t0, ex); };
  box.append(slot, bank, check);
}
function answerBox(box, ph, onSubmit){

  ta.addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!send.disabled) send.click(); } });
  send.onclick = async () => { await stopDict(); send.remove(); ta.disabled = true; box.querySelectorAll(".mic").forEach(m=>m.remove()); onSubmit(ta.value); };
  box.append(h("div",{class:"answer"}, ta, micFor(ta)), send);

}

/* small on-device models do best with a short system prompt and a flat JSON shape */
function talkSystem(sc){
  const knownChunks = allCards().filter(c=>S.cards[c.id]).slice(-12).map(c=>c.en).join(" | ");
  return `You are ${sc.persona}. ${sc.setting} You talk with a Korean learner of English (CEFR ${sc.lvl}).
Stay in character. Use 1-2 short, simple, natural sentences (max 25 words). End with a question or something easy to answer.
${knownChunks ? "If natural, reuse these phrases: " + knownChunks + "." : ""}
Learner missions: ${sc.missions.map((m,i)=>i+"="+m).join(", ")}. Steer toward missions not done yet.
Always answer with one JSON object with these keys:
"reply": your English line in character.
"reply_ko": Korean translation of reply.
"corrected": if the learner's last message had a mistake or sounded unnatural, the natural English version of what they meant; otherwise "".
"note_ko": a very short Korean reason for the correction, or "".
"missions_done": array of mission numbers the learner has completed so far.
"suggestions": array of two short English lines the learner could say next.
"end": true only if the scene has naturally finished.`;
}
function talkUser(newMsg){
  const hist = talk.turns.slice(-10).map(t => (t.role==="ai"?"You: ":"Learner: ")+t.text).join("\n");
  return (hist ? "Conversation so far:\n" + hist + "\n\n" : "") +
    (newMsg ? `Learner's last message: "${newMsg}"\nRespond as JSON.` : "Start the scene with a short greeting in character. Respond as JSON.");
}
function startTalk(sc){
  talk = {sc, turns:[], missions:new Set(), feedback:[], active:true, busy:false, started:Date.now()};
  const app = $("#app"); app.replaceChildren(); stopDict();
  const ms = h("div",{class:"missions"});
  const drawMissions = () => ms.replaceChildren(...sc.missions.map((m,i)=>h("span",{class:"chip"+(talk.missions.has(i)?" ok":"")}, (talk.missions.has(i)?"✓ ":"")+m)));
  drawMissions();
  app.append(h("div",{class:"topbar"}, h("button",{class:"x","aria-label":"대화 끝내기",onclick:()=>endTalk()},"×"), h("div",{style:"flex:1;min-width:0"}, h("div",{style:"font-weight:700"}, sc.t), h("div",{class:"ctx"}, sc.d))), ms);
  const chat = h("div",{class:"chat"}); const sugg = h("div",{class:"sugg"}); const status = h("p",{class:"typing",hidden:true},"상대가 말하는 중…");
  const ta = h("textarea",{id:"talk-input",rows:"2",placeholder:"영어로 답하기","data-ph":"영어로 답하기",autocomplete:"off",spellcheck:"false","aria-label":"영어로 답하기"});
  const send = h("button",{class:"primary"},"보내기");
  const hintBtn = h("button",{class:"ghost",type:"button"},"뭐라고 하지?");
  const finishBtn = h("button",{class:"ghost",type:"button",onclick:()=>endTalk()},"대화 마치고 피드백 받기");
  app.append(chat, status, h("div",{class:"composer"}, sugg, h("div",{class:"answer"}, ta, micFor(ta)), h("div",{class:"row"}, send, hintBtn), finishBtn));
  send.style.width = "auto"; send.style.flex = "1";
  let lastSugg = [];
  hintBtn.onclick = () => { sugg.replaceChildren(...lastSugg.map(t=>h("button",{onclick:()=>{ ta.value=t; ta.dispatchEvent(new Event("input")); }}, t))); if (!lastSugg.length) toast("상대가 먼저 말할 때까지 기다려 주세요."); };
  ta.addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send.click(); } });
  const addAI = (r) => {
    const b = h("div",{class:"msg ai"}, h("div",{}, r.reply));
    const ko = h("div",{class:"ko",hidden:true}, r.reply_ko||"");
    const sp = h("button",{type:"button"},"듣기"); sp.onclick = () => say(r.reply, 1);
    const tr = h("button",{type:"button"},"번역"); tr.onclick = () => ko.hidden = !ko.hidden;
    b.append(ko, h("div",{class:"tools"}, sp, tr)); chat.append(b);
    say(r.reply, 1);
  };
  async function turn(userText){
    if (talk.busy || !talk.active) return; talk.busy = true; send.disabled = true; status.hidden = false; sugg.replaceChildren();
    if (userText) { talk.turns.push({role:"me", text:userText}); chat.append(h("div",{class:"msg me"}, userText)); }
    try {
      if (!llm.engine) throw {code:"no_engine"};
      const r = await llmJSON(talkSystem(sc), talkUser(userText));
      if (!talk.active) return;
      if (!r || typeof r.reply !== "string" || !r.reply.trim()) throw {code:"invalid_json"};
      const fbObj = r.feedback && typeof r.feedback === "object" ? r.feedback : null;
      const corrected = String((fbObj && fbObj.corrected) || r.corrected || "").trim();
      const noteKo = String((fbObj && fbObj.note_ko) || r.note_ko || "").trim();
      const same = corrected && toks(corrected).join(" ") === toks(userText||"").join(" ");
      if (userText && corrected && !same) {
        talk.feedback.push({said:userText, corrected, note:noteKo});
        chat.append(h("div",{class:"recast"}, h("span",{class:"ctx"},"이렇게 말하면 더 자연스러워요"), h("b",{}, corrected), noteKo ? h("span",{class:"ctx"}, noteKo) : ""));
        addXP(2);
      } else if (userText) addXP(5);
      (Array.isArray(r.missions_done)?r.missions_done:[]).forEach(i=>{ if (Number.isInteger(i) && i>=0 && i<sc.missions.length && !talk.missions.has(i)) { talk.missions.add(i); addXP(10); toast("미션 완료 · "+sc.missions[i]); } });
      drawMissions();
      talk.turns.push({role:"ai", text:r.reply}); addAI(r);
      lastSugg = (Array.isArray(r.suggestions)?r.suggestions:[]).map(String).slice(0,3);
      if (r.end) { finishBtn.textContent = "장면이 끝났어요 · 피드백 받기"; finishBtn.className = "primary"; }
    } catch(e) {
      if (e && e.code === "no_engine") { toast("먼저 AI 모델을 준비해 주세요."); endTalk(true); return; }
      toast("AI가 답하지 못했어요. 다시 보내 주세요.");
      if (userText) { talk.turns.pop(); chat.lastChild && chat.lastChild.remove(); ta.value = userText; }
    } finally { talk.busy = false; send.disabled = false; status.hidden = true; status.scrollIntoView({block:"end",behavior:"smooth"}); }
  }
  send.onclick = async () => { await stopDict(); const v = ta.value.trim(); if (!v) return; ta.value = ""; turn(v); };
  turn("");
}
async function endTalk(silent){
  stopDict();
  if (!talk) { route(); return; }
  const t = talk; t.active = false;
  const mine = t.turns.filter(x=>x.role==="me");
  if (silent || mine.length < 2 || !llm.engine) { talk = null; if (!silent && mine.length) toast("두 번 이상 말하면 피드백을 드려요."); route(); return; }
  S.talks++; save();
  const app = $("#app"); app.replaceChildren(h("p",{class:"eyebrow"},"대화 피드백"), h("p",{class:"typing"},"대화를 돌아보는 중…"));
  const words = mine.map(m=>toks(m.text).length); const mlu = (words.reduce((a,b)=>a+b,0)/words.length).toFixed(1);
  const acc = Math.round((1 - t.feedback.length/mine.length)*100);
  let r = null;
  try {
    r = await llmJSON(
      `You are a kind English tutor for Korean learners. You review a short role-play and answer with one JSON object with keys:
"summary_ko": one Korean sentence on how it went.
"strength_ko": one specific thing the learner did well, in Korean.
"fix_ko": the single most useful thing to fix next time, in Korean, with one English example.
"chunks": array of exactly 3 objects {"en": a natural multi-word English phrase from this scene worth memorizing, "ko": its Korean meaning}.`,
      `Learner level: CEFR ${t.sc.lvl}. Scene: ${t.sc.persona}.
Transcript:
${t.turns.slice(-16).map(x=>(x.role==="ai"?"Partner: ":"Learner: ")+x.text).join("\n")}
Corrections already given: ${JSON.stringify(t.feedback.slice(-6))}
Respond as JSON.`, 420);
  } catch(e) { r = null; }
  talk = null;
  app.replaceChildren();
  app.append(h("p",{class:"eyebrow"}, t.sc.t+" · 대화 피드백"), h("h1",{class:"big"}, t.missions.size+"/"+t.sc.missions.length+" 미션"));
  app.append(h("div",{class:"kpis"},
    h("div",{class:"kpi"}, h("b",{}, String(mine.length)), h("span",{},"내가 한 말 (턴)")),
    h("div",{class:"kpi"}, h("b",{}, mlu), h("span",{},"평균 발화 길이 (단어)")),
    h("div",{class:"kpi"}, h("b",{}, acc+"%"), h("span",{},"고칠 곳 없던 턴")),
    h("div",{class:"kpi"}, h("b",{}, String(t.feedback.length)), h("span",{},"받은 교정"))));
  if (r && typeof r === "object") {
    const sec = h("section",{class:"task"});
    if (r.summary_ko) sec.append(h("p",{}, String(r.summary_ko)));
    if (r.strength_ko) sec.append(h("div",{class:"fb good"}, h("div",{class:"head"},"잘한 점"), h("div",{}, String(r.strength_ko))));
    if (r.fix_ko) sec.append(h("div",{class:"fb bad"}, h("div",{class:"head"},"다음엔 이것 하나만"), h("div",{}, String(r.fix_ko))));
    app.append(sec);
    const chunks = (Array.isArray(r.chunks)?r.chunks:[]).filter(c=>c&&c.en&&c.ko).slice(0,3);
    if (chunks.length) {
      const box = h("section",{class:"task"}, h("h2",{},"표현함에 담을 표현"));
      chunks.forEach(c => box.append(h("div",{class:"row",style:"justify-content:space-between"}, h("div",{style:"min-width:0"}, h("div",{style:"font-weight:600"}, String(c.en)), h("div",{class:"ctx"}, String(c.ko))), speakBtn(String(c.en),"듣기"))));
      const add = h("button",{class:"primary"},"모두 표현함에 담기");
      add.onclick = () => { let n=0; chunks.forEach(c => { const en=String(c.en).trim(); if (allCards().some(x=>toks(x.en).join(" ")===toks(en).join(" "))) return;
        S.custom.push({id:"u"+Date.now().toString(36)+n, tag:"AI 대화", lvl:t.sc.lvl, en, ko:String(c.ko).trim(), alts:[], note:"'"+t.sc.t+"' 대화에서"}); n++; });
        save(); add.disabled = true; add.textContent = n ? n+"개를 담았어요 · 내일 복습에 나와요" : "이미 표현함에 있어요"; };
      box.append(add); app.append(box);
    }
  } else app.append(h("p",{class:"muted"},"자세한 피드백을 받지 못했어요. 위 숫자는 이 기기에서 계산한 값이에요."));
  if (t.feedback.length) { const box = h("section",{class:"task"}, h("h2",{},"고쳐 본 문장"));
    t.feedback.forEach(f => box.append(h("div",{}, h("div",{class:"ctx",style:"text-decoration:line-through"}, f.said), h("div",{style:"font-weight:600"}, f.corrected), f.note? h("div",{class:"ctx"}, f.note):"")));
    app.append(box); }
  app.append(h("button",{class:"cta alt",onclick:()=>{ location.hash="#talk"; route(); }}, h("div",{}, h("b",{},"다른 상황 고르기")), h("span",{class:"arrow","aria-hidden":"true"},"→")));
}

/* ---------- DECK ---------- */
let deckFilter = "전체";
function viewDeck(app){
  const cards = allCards(); const tags = ["전체", ...new Set(cards.map(c=>c.tag))];
  app.append(h("p",{class:"eyebrow"},"표현함 · "+cards.length+"개"), h("h1",{style:"font-family:var(--f-display);font-weight:400;font-size:36px"},"입에 붙일 덩어리들"),
    h("p",{class:"lead muted"},"단어 하나가 아니라 통째로 쓰는 표현을 모읍니다. 막대가 다섯 칸 차면 몇 주 동안 잊지 않는 상태예요."));
  const fl = h("div",{class:"filters",role:"group","aria-label":"상황별 보기"}); const list = h("div",{class:"cards"});
  const draw = () => { fl.replaceChildren(...tags.map(t=>h("button",{"aria-pressed":String(t===deckFilter),onclick:()=>{ deckFilter=t; draw(); }}, t)));
    list.replaceChildren(...cards.filter(c=>deckFilter==="전체"||c.tag===deckFilter).sort((a,b)=>mastery(b.id)-mastery(a.id)).map(c=>{ const m = mastery(c.id);
      const row = h("button",{class:"card",style:"border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;width:100%",onclick:()=>say(c.en,1),"aria-label":c.en+" 듣기"},
        h("div",{class:"en"}, c.en), h("div",{class:"ko"}, c.ko),
        h("div",{class:"m"}, h("div",{class:"meter"}, ...[0,1,2,3,4].map(k=>h("i",{class:k<=m-1||(k===0&&m>0)?"on":""}))), h("span",{}, MASTERY_LABEL[m])));
      return row; })); };
  draw(); app.append(fl, list);
}

/* ---------- SCIENCE ---------- */
function viewScience(app){
  app.append(h("p",{class:"eyebrow"},"이 앱이 이렇게 생긴 이유"), h("h1",{style:"font-family:var(--f-display);font-weight:400;font-size:36px"},"연구가 정한 설계"),
    h("p",{class:"lead muted"},"기능마다 근거가 있어요. 왼쪽은 제2언어 습득과 기억 연구에서 확인된 원리, 오른쪽은 그 원리가 화면에서 어떻게 쓰였는지예요."));
  const P = [
    ["덩어리로 배우기","Wray (2002); Boers et al. (2006), Language Teaching Research","원어민 발화의 큰 부분은 미리 조립된 표현이고, 이런 덩어리를 많이 쓰는 학습자가 더 유창하게 들립니다.","<b>적용</b> 모든 학습 단위가 단어가 아닌 문장 덩어리입니다."],
    ["간격 반복","Cepeda et al. (2006), Psychological Bulletin; Ye et al. (2022), KDD","잊기 직전에 다시 떠올릴수록 기억이 오래갑니다. FSRS는 이 간격을 기억 모델로 계산합니다.","<b>적용</b> FSRS 방식으로 표현마다 기억 안정도를 계산해, 기억할 확률이 약 90%로 떨어질 때 복습에 넣습니다."],
    ["떠올리기 연습","Roediger & Karpicke (2006); Karpicke & Roediger (2008), Science","다시 읽기보다 기억에서 꺼내 보는 시험이 장기 기억을 더 크게 늘립니다.","<b>적용</b> 복습은 보기 없이 한국어만 보고 영어로 말하게 합니다. 힌트는 첫 단어까지만."],
    ["이해 가능한 입력 먼저","Krashen (1985); VanPatten (2004)","이해할 수 있는 입력이 습득의 재료입니다. 새 표현은 먼저 소리와 뜻으로 받아들인 뒤 말합니다.","<b>적용</b> 새 표현은 '듣고 뜻 고르기'로 먼저 만나고, 같은 세션 뒤쪽에서 직접 조립합니다."],
    ["출력과 알아차리기","Swain (1985, 1995); Schmidt (1990), Applied Linguistics","직접 말해 봐야 내가 모르는 부분이 드러나고, 그 차이를 알아차려야 습득이 일어납니다.","<b>적용</b> 답을 내면 내 문장과 자연스러운 문장을 나란히 놓고, 빠진 단어를 강조합니다."],
    ["대화 속 교정 (리캐스트)","Long (1996); Lyster & Ranta (1997); Li (2010), Language Learning","의미 중심 대화 안에서 받는 교정 피드백은 습득에 뚜렷한 효과가 있습니다.","<b>적용</b> AI 상황극에서 틀린 문장은 대화를 끊지 않고 고친 문장을 옆에 보여 줍니다."],
    ["과제 중심 말하기","Ellis (2003), Task-based Language Learning and Teaching","실제 목표가 있는 과제를 수행할 때 언어를 의미 있게 씁니다.","<b>적용</b> 상황극마다 미션 세 개가 있고, 미션을 달성해야 장면이 마무리됩니다."],
    ["섀도잉","Hamada (2016), Language Teaching Research","들리는 대로 바로 따라 말하기는 소리 인식과 말하기 유창성을 함께 키웁니다.","<b>적용</b> 복습 셋 중 하나는 원어민 속도·느린 속도로 듣고 따라 말하는 문제입니다."],
    ["바람직한 어려움과 섞어 풀기","Bjork (1994); Bjork & Bjork (2011)","조금 어렵게, 여러 유형을 섞어서 연습하면 당장은 느려도 오래 남습니다.","<b>적용</b> 한 세션 안에서 듣기·조립·인출·섀도잉이 섞이고, 틀린 표현은 세 문제 뒤에 다시 나옵니다."],
    ["복잡성·정확성·유창성 (CAF)","Housen & Kuiken (2009), Applied Linguistics; Skehan (2009)","말하기 능력은 복잡성, 정확성, 유창성 세 축으로 따로 보아야 정확합니다.","<b>적용</b> 대화가 끝나면 평균 발화 길이, 고칠 곳 없던 턴의 비율, 말한 턴 수를 따로 보여 줍니다."],
    ["자율성·유능감·관계","Deci & Ryan (2000), American Psychologist","스스로 고르고, 잘하고 있다고 느끼고, 연결되어 있을 때 동기가 오래갑니다.","<b>적용</b> 하루 목표는 50 XP로 작게, 연속 기록과 콤보로 성취를 보이게 하고, 상황은 직접 고릅니다."]
  ];
  const box = h("div",{class:"prin"});
  P.forEach(([t,src,body,use]) => box.append(h("article",{}, h("h3",{}, t), h("div",{class:"src"}, src), h("p",{}, body), h("p",{class:"use",html:use}))));
  app.append(box);
  app.append(h("p",{class:"eyebrow",style:"margin-top:8px"},"인기 앱 분석에서 가져온 것"));
  const RE = h("div",{class:"prin"});
  [["AI 대화의 턴 구조","실시간 음성 AI 레슨은 '질문 → 내 발화 확정 → 교정 → 다음 질문' 흐름과 미션 진행도를 따로 관리합니다. 말문의 상황극도 같은 흐름에 미션 칩을 둡니다."],
   ["막혔을 때 추천 답변","AI 영상통화 기능은 막힌 학습자에게 다음에 할 말을 추천합니다. 말문의 '뭐라고 하지?' 버튼이 같은 역할입니다."],
   ["CAF 기반 분석","1:1 수업 녹음을 복잡성·정확성·유창성으로 나눠 보여 주는 분석 방식을 대화 피드백 숫자에 가볍게 옮겼습니다."],
   ["대화에서 나온 표현을 복습으로","AI 튜터 대화에서 나온 표현을 간격 반복 복습으로 넘기는 구조를 그대로 따릅니다."],
   ["짧은 세션과 연속 기록","5분 세션, 일일 목표, 연속 기록처럼 매일 돌아오게 만드는 장치는 대부분의 인기 앱이 공통으로 씁니다."]
  ].forEach(([t,b]) => RE.append(h("article",{}, h("h3",{}, t), h("p",{class:"use"}, b))));
  app.append(RE);
}

route();
